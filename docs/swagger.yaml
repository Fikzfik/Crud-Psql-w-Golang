basePath: /api
definitions:
  models.Alumni:
    properties:
      alamat:
        type: string
      angkatan:
        type: integer
      created_at:
        type: string
      fakultas:
        type: string
      id:
        type: string
      jurusan:
        type: string
      nama:
        type: string
      nim:
        type: string
      no_telepon:
        type: string
      tahun_lulus:
        type: integer
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.AlumniResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Alumni'
        type: array
      meta:
        $ref: '#/definitions/models.MetaInfo'
    type: object
  models.FileResponse:
    properties:
      file_name:
        type: string
      file_path:
        type: string
      file_size:
        type: integer
      file_type:
        type: string
      id:
        type: string
      original_name:
        type: string
      uploaded_at:
        type: string
    type: object
  models.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  models.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  models.MetaInfo:
    properties:
      limit:
        type: integer
      order:
        type: string
      page:
        type: integer
      pages:
        type: integer
      search:
        type: string
      sortBy:
        type: string
      total:
        type: integer
    type: object
  models.PekerjaanAlumni:
    properties:
      alumni_id:
        type: string
      bidang_industri:
        type: string
      created_at:
        type: string
      deskripsi_pekerjaan:
        type: string
      gaji_range:
        type: string
      id:
        type: string
      is_deleted:
        type: boolean
      lokasi_kerja:
        type: string
      nama_perusahaan:
        type: string
      posisi_jabatan:
        type: string
      status_pekerjaan:
        type: string
      tanggal_mulai_kerja:
        type: string
      tanggal_selesai_kerja:
        type: string
      updated_at:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
host: localhost:3000
info:
  contact: {}
  description: |-
    Masukkan token JWT dengan format: Bearer <token>
    API untuk manajemen data alumni, pekerjaan, dan user
  title: CRUD Alumni API
  version: "1.0"
paths:
  /alumni:
    get:
      consumes:
      - application/json
      description: Mengambil data alumni dengan pagination, search, dan sorting
      parameters:
      - description: Halaman saat ini (default 1)
        in: query
        name: page
        type: integer
      - description: Jumlah data per halaman (default 10)
        in: query
        name: limit
        type: integer
      - description: 'Kolom pengurutan (default: created_at)'
        in: query
        name: sortBy
        type: string
      - description: Arah pengurutan (asc/desc)
        in: query
        name: order
        type: string
      - description: Kata kunci pencarian
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AlumniResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan daftar alumni
      tags:
      - Alumni
    post:
      consumes:
      - application/json
      description: Membuat data alumni baru (hanya admin)
      parameters:
      - description: Data Alumni
        in: body
        name: alumni
        required: true
        schema:
          $ref: '#/definitions/models.Alumni'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Menambahkan alumni baru
      tags:
      - Alumni
  /alumni/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus data alumni berdasarkan ID (hanya admin)
      parameters:
      - description: ID Alumni
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Menghapus alumni
      tags:
      - Alumni
    get:
      consumes:
      - application/json
      description: Mengambil satu data alumni berdasarkan ID
      parameters:
      - description: ID Alumni
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Alumni'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan detail alumni berdasarkan ID
      tags:
      - Alumni
    put:
      consumes:
      - application/json
      description: Update data alumni berdasarkan ID (hanya admin)
      parameters:
      - description: ID Alumni
        in: path
        name: id
        required: true
        type: string
      - description: Data Alumni yang diupdate
        in: body
        name: alumni
        required: true
        schema:
          $ref: '#/definitions/models.Alumni'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mengupdate data alumni
      tags:
      - Alumni
  /alumni/all:
    get:
      consumes:
      - application/json
      description: Mengambil seluruh data alumni dari database tanpa pagination atau
        filter
      produces:
      - application/json
      responses:
        "200":
          description: Daftar seluruh alumni
          schema:
            items:
              $ref: '#/definitions/models.Alumni'
            type: array
        "404":
          description: Data alumni tidak ditemukan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan semua data alumni
      tags:
      - Alumni
  /foto/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload foto profil untuk user. Hanya admin bisa upload foto milik
        user lain.
      parameters:
      - description: File foto (JPEG, JPG, PNG, max 1MB)
        in: formData
        name: foto
        required: true
        type: file
      - description: ID user (opsional, hanya admin boleh isi)
        in: formData
        name: user_id
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.FileResponse'
        "400":
          description: Request tidak valid
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Tidak diizinkan upload user lain
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menyimpan file atau metadata
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload foto pengguna
      tags:
      - Upload
  /login:
    post:
      consumes:
      - application/json
      description: Login dengan email dan password untuk mendapatkan token JWT
      parameters:
      - description: Data login (email & password)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.LoginResponse'
        "400":
          description: Request body tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Email atau password salah
          schema:
            additionalProperties: true
            type: object
      summary: Login user
      tags:
      - Auth
  /pekerjaan:
    post:
      consumes:
      - application/json
      description: Menambahkan data pekerjaan alumni baru ke database
      parameters:
      - description: Data pekerjaan
        in: body
        name: pekerjaan
        required: true
        schema:
          $ref: '#/definitions/models.PekerjaanAlumni'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.PekerjaanAlumni'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Menambahkan data pekerjaan baru
      tags:
      - Pekerjaan
  /pekerjaan/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus pekerjaan alumni berdasarkan ID
      parameters:
      - description: ID Pekerjaan
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Menghapus data pekerjaan
      tags:
      - Pekerjaan
    put:
      consumes:
      - application/json
      description: Mengupdate data pekerjaan berdasarkan ID
      parameters:
      - description: ID Pekerjaan
        in: path
        name: id
        required: true
        type: string
      - description: Data pekerjaan
        in: body
        name: pekerjaan
        required: true
        schema:
          $ref: '#/definitions/models.PekerjaanAlumni'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PekerjaanAlumni'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update data pekerjaan alumni
      tags:
      - Pekerjaan
  /pekerjaan/all:
    get:
      consumes:
      - application/json
      description: Mengambil seluruh data pekerjaan dari database tanpa pagination
        atau filter
      produces:
      - application/json
      responses:
        "200":
          description: Daftar seluruh Pekerjaan Alumni
          schema:
            items:
              $ref: '#/definitions/models.PekerjaanAlumni'
            type: array
        "404":
          description: Data pekerjaan tidak ditemukan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan semua data pekerjaan
      tags:
      - Pekerjaan
  /pekerjaan/alumni/{alumni_id}:
    get:
      consumes:
      - application/json
      description: Mengambil semua pekerjaan yang dimiliki oleh satu alumni tertentu
      parameters:
      - description: ID Alumni
        in: path
        name: alumni_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.PekerjaanAlumni'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan data pekerjaan berdasarkan ID alumni
      tags:
      - Pekerjaan
  /profile:
    get:
      description: Mengambil data profil berdasarkan token JWT yang dikirim di header
        Authorization
      produces:
      - application/json
      responses:
        "200":
          description: Profile berhasil diambil
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Token tidak valid atau tidak ada
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan profil user yang sedang login
      tags:
      - Auth
  /sertifikat/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload file sertifikat dalam format PDF (hanya admin bisa upload
        milik user lain)
      parameters:
      - description: File sertifikat (PDF, max 2MB)
        in: formData
        name: sertifikat
        required: true
        type: file
      - description: ID user (opsional, hanya admin boleh isi)
        in: formData
        name: user_id
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.FileResponse'
        "400":
          description: Request tidak valid
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Tidak diizinkan upload user lain
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menyimpan file atau metadata
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload sertifikat pengguna
      tags:
      - Upload
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
